services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: so-dup-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: so-dup-app
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # Внутри сети Docker до ES обращаемся по имени сервиса, а не по localhost
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8000:8000"
    volumes:
      # Кэш модели sentence-transformers, чтобы не качать её при каждом перезапуске
      - hf-cache:/root/.cache/huggingface

volumes:
  es-data:
  hf-cache:
